[project]
name = "record-browser-requests"
version = "0.1.0"
description = "Grava requests do browser (HAR via Playwright) e gera catálogo de endpoints e fluxo"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
